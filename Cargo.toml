[package]
name = "fleet-conductor"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Fleet orchestration conductor for distributed agent coordination"

[dependencies]
serde = { version = "1", features = ["derive"] }
